
<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Selaa ja etsi elokuvia.">
    <title>NETFLIX | Elokuvat</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <h1 class="logo">NETFLIX</h1>

        <nav aria-label="Päänavigaatio">
            <a href="elokuvalista.html">Etusivu</a>
            <a href="movies.html" aria-current="page">Elokuvat</a>
            <a href="favorites.html">Suosikit</a>
        </nav>
    </header>

    <main class="movies-page">

        <section class="page-heading">
            <h2>Kaikki elokuvat</h2>
            <p>Löydä seuraava suosikkielokuvasi.</p>
        </section>

        <section class="search-section" aria-label="Elokuvien haku">

            <label for="searchMovie">Hae elokuvaa</label>

            <input
                type="search"
                id="searchMovie"
                placeholder="Kirjoita elokuvan nimi..."
                autocomplete="off"
            >

            <label for="genreFilter">Valitse genre</label>

            <select id="genreFilter">
                <option value="all">Kaikki genret</option>
                <option value="Sci-Fi">Sci-Fi</option>
                <option value="Toiminta">Toiminta</option>
                <option value="Seikkailu">Seikkailu</option>
                <option value="Draama">Draama</option>
                <option value="Trilleri">Trilleri</option>
            </select>

        </section>
        
<section class="add-movie-section">

    <h2>Lisää uusi elokuva</h2>

    <form id="addMovieForm">

        <label for="movieTitle">Elokuvan nimi</label>
        <input
            type="text"
            id="movieTitle"
            name="title"
            required
            minlength="2"
            maxlength="60"
            placeholder="Esim. Interstellar"
        >

        <label for="movieYear">Julkaisuvuosi</label>
        <input
            type="number"
            id="movieYear"
            name="year"
            min="1888"
            max="2100"
            required
        >

        <label for="movieGenre">Genre</label>
        <input
            type="text"
            id="movieGenre"
            name="genre"
            list="genreSuggestions"
            required
            maxlength="40"
            placeholder="Valitse tai kirjoita genre"
        >

        <datalist id="genreSuggestions">
            <option value="Sci-Fi">
            <option value="Toiminta">
            <option value="Seikkailu">
            <option value="Draama">
            <option value="Trilleri">
            <option value="Komedia">
            <option value="Kauhu">
        </datalist>

        <label for="movieRating">Arvosana (0–10)</label>
        <input
            type="number"
            id="movieRating"
            name="rating"
            min="0"
            max="10"
            step="0.1"
            required
        >

        <label for="movieImage">Julisteen kuvan osoite</label>
        <input
            type="url"
            id="movieImage"
            name="image"
            required
            placeholder="https://..."
        >

        <label for="movieDescription">Elokuvan kuvaus</label>
        <textarea
            id="movieDescription"
            name="description"
            required
            minlength="10"
            maxlength="500"
            placeholder="Kirjoita elokuvan kuvaus..."
        ></textarea>

        <button type="submit">Lisää elokuva</button>

    </form>

    <p id="addMovieMessage" role="status" aria-live="polite"></p>

</section>

        <section class="movies-section" aria-labelledby="movie-list-title">

            <h2 id="movie-list-title">Elokuvavalikoima</h2>

            <div class="movie-grid" id="movieGrid">

                <!-- Elokuvat haetaan JSON Serveristä JavaScriptillä -->

            </div>

            <p id="movieMessage" role="status" aria-live="polite"></p>

        </section>

    </main>

    <footer>
        <p>NETFLIX-elokuvasovellus © 2026</p>
    </footer>

</body>
</html>
