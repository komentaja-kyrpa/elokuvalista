
<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MovieFlix</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #141414;
    color: white;
    font-family: Arial, sans-serif;
}

/* NAVIGAATIO */
header {
    background: #080808;
    padding: 20px 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    color: #e50914;
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 2px;
}

header input {
    padding: 11px 15px;
    border-radius: 5px;
    border: 1px solid #555;
    background: #222;
    color: white;
    width: 220px;
}

/* HERO */
.hero {
    padding: 70px 6%;
    min-height: 300px;
    background: linear-gradient(90deg, #000 5%, #400b0b 60%, #141414);
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.hero h1 {
    font-size: 45px;
    margin-bottom: 15px;
}

.hero p {
    color: #ccc;
    max-width: 500px;
    line-height: 1.6;
}

/* LISÄÄ ELOKUVA */
.add-section {
    padding: 35px 5%;
}

.add-section h2 {
    margin-bottom: 20px;
}

.form {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.form input, .form select {
    padding: 13px;
    background: #292929;
    border: 1px solid #444;
    border-radius: 5px;
    color: white;
    flex: 1;
    min-width: 150px;
}

button {
    border: none;
    border-radius: 5px;
    cursor: pointer;
    padding: 13px 20px;
    font-weight: bold;
    transition: 0.2s;
}

.add-btn {
    background: #e50914;
    color: white;
}

button:hover {
    opacity: 0.8;
    transform: scale(1.02);
}

/* ELOKUVAT */
.movies-section {
    padding: 20px 5% 60px;
}

.movies-section h2 {
    margin-bottom: 25px;
}

.movie-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 25px;
}

.movie-card {
    background: #222;
    border-radius: 8px;
    overflow: hidden;
    transition: 0.25s;
    position: relative;
}

.movie-card:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 25px #000;
}

.poster {
    height: 240px;
    background: linear-gradient(135deg, #521010, #151515);
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    background-size: cover;
    background-position: center;
}

.poster h3 {
    font-size: 22px;
    text-align: center;
    padding: 15px;
    text-shadow: 2px 2px 5px black;
}

.movie-info {
    padding: 15px;
}

.movie-info h3 {
    margin-bottom: 8px;
    font-size: 17px;
}

.movie-info p {
    color: #aaa;
    font-size: 13px;
    margin-bottom: 12px;
}

.delete-btn {
    background: #444;
    color: white;
    width: 100%;
    padding: 9px;
}

.empty {
    color: #aaa;
    padding: 20px 0;
    grid-column: 1 / -1;
}

footer {
    text-align: center;
    padding: 25px;
    background: #080808;
    color: #777;
}

@media(max-width: 600px) {
    header {
        flex-direction: column;
        gap: 15px;
    }

    header input {
        width: 100%;
    }

    .hero h1 {
        font-size: 32px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">MOVIEFLIX</div>
    <input
        type="text"
        id="search"
        placeholder="🔍 Etsi elokuvaa..."
    >
</header>

<section class="hero">
    <h1>Elokuvien maailma.</h1>
    <p>
        Löydä suosikkielokuvasi, lisää uusia elokuvia
        omaan kokoelmaasi ja rakenna oma elokuvalistasi.
    </p>
</section>

<section class="add-section">
    <h2>➕ Lisää uusi elokuva</h2>

    <form class="form" id="movieForm">

        <input
            type="text"
            id="title"
            placeholder="Elokuvan nimi"
            required
        >

        <input
            type="number"
            id="year"
            placeholder="Julkaisuvuosi"
            min="1888"
            max="2100"
            required
        >

        <select id="genre" required>
            <option value="">Valitse genre</option>
            <option>Toiminta</option>
            <option>Komedia</option>
            <option>Kauhu</option>
            <option>Draama</option>
            <option>Scifi</option>
            <option>Seikkailu</option>
            <option>Romantiikka</option>
            <option>Fantasia</option>
            <option>Muu</option>
        </select>

        <input
            type="url"
            id="poster"
            placeholder="Julisteen kuvan URL (valinnainen)"
        >

        <button type="submit" class="add-btn">
            + Lisää elokuva
        </button>

    </form>
</section>

<section class="movies-section">
    <h2>🎬 Oma elokuvakokoelma</h2>

    <div class="movie-grid" id="movieGrid"></div>
</section>

<footer>
    MOVIEFLIX © 2026 – Oma elokuvakokoelmasi
</footer>

<script>

// ESIMERKKIELOKUVAT
const defaultMovies = [
    {
        id: 1,
        title: "Inception",
        year: 2010,
        genre: "Scifi",
        poster: "",
        color: "linear-gradient(135deg,#162b52,#080c18)"
    },
    {
        id: 2,
        title: "Interstellar",
        year: 2014,
        genre: "Scifi",
        poster: "",
        color: "linear-gradient(135deg,#533e27,#101019)"
    },
    {
        id: 3,
        title: "The Dark Knight",
        year: 2008,
        genre: "Toiminta",
        poster: "",
        color: "linear-gradient(135deg,#353535,#080808)"
    },
    {
        id: 4,
        title: "Titanic",
        year: 1997,
        genre: "Romantiikka",
        poster: "",
        color: "linear-gradient(135deg,#163d63,#080d20)"
    },
    {
        id: 5,
        title: "Avatar",
        year: 2009,
        genre: "Seikkailu",
        poster: "",
        color: "linear-gradient(135deg,#087eaa,#071d36)"
    }
];

// HAETAAN TALLENNETUT ELOKUVAT
let movies = JSON.parse(
    localStorage.getItem("movieflixMovies")
) || defaultMovies;

// TALLENNUS
function saveMovies() {
    localStorage.setItem(
        "movieflixMovies",
        JSON.stringify(movies)
    );
}

// NÄYTÄ ELOKUVAT
function renderMovies(filter = "") {

    const grid = document.getElementById("movieGrid");

    grid.innerHTML = "";

    const filteredMovies = movies.filter(movie =>
        movie.title.toLowerCase().includes(filter.toLowerCase()) ||
        movie.genre.toLowerCase().includes(filter.toLowerCase())
    );

    if (filteredMovies.length === 0) {
        grid.innerHTML =
            '<p class="empty">Elokuvia ei löytynyt.</p>';
        return;
    }

    filteredMovies.forEach(movie => {

        const card = document.createElement("div");
        card.className = "movie-card";

        const poster = document.createElement("div");
        poster.className = "poster";

        if (movie.poster) {
            poster.style.backgroundImage =
                `linear-gradient(#0002,#0007), url("${movie.poster}")`;
        } else {
            poster.style.background = movie.color ||
                "linear-gradient(135deg,#521010,#151515)";
        }

        const posterTitle = document.createElement("h3");
        posterTitle.textContent = movie.title;
        poster.appendChild(posterTitle);

        const info = document.createElement("div");
        info.className = "movie-info";

        const title = document.createElement("h3");
        title.textContent = movie.title;

        const details = document.createElement("p");
        details.textContent =
            movie.year + " • " + movie.genre;

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-btn";
        deleteButton.textContent = "Poista elokuva";

        deleteButton.addEventListener("click", () => {
            movies = movies.filter(m => m.id !== movie.id);
            saveMovies();
            renderMovies(document.getElementById("search").value);
        });

        info.append(title, details, deleteButton);
        card.append(poster, info);
        grid.appendChild(card);

    });
}

// LISÄÄ UUSI ELOKUVA
document.getElementById("movieForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const title = document.getElementById("title").value.trim();
    const year = Number(document.getElementById("year").value);
    const genre = document.getElementById("genre").value;
    const poster = document.getElementById("poster").value.trim();

    if (!title || !year || !genre) return;

    const newMovie = {
        id: Date.now(),
        title: title,
        year: year,
        genre: genre,
        poster: poster,
        color: "linear-gradient(135deg,#8b101b,#171717)"
    };

    movies.push(newMovie);

    saveMovies();
    renderMovies(document.getElementById("search").value);

    this.reset();

});

// HAKUTOIMINTO
document.getElementById("search")
.addEventListener("input", function() {
    renderMovies(this.value);
});

// KÄYNNISTYS
saveMovies();
renderMovies();

</script>

</body>
</html>
