
<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Elokuvan tiedot ja muokkaaminen.">

    <title>NETFLIX | Elokuvan tiedot</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>

        <h1 class="logo">NETFLIX</h1>

        <nav aria-label="Päänavigaatio">
            <a href="elokuvalista.html">Etusivu</a>
            <a href="movies.html">Elokuvat</a>
            <a href="favorites.html">Suosikit</a>
        </nav>

    </header>

    <main>

        <section class="details" id="movieDetails">

            <!-- Elokuvan tiedot haetaan JavaScriptillä -->

            <p id="detailsMessage" role="status">
                Ladataan elokuvan tietoja...
            </p>

        </section>

        <section class="movie-actions">

            <button type="button" id="editMovieButton">
                Muokkaa elokuvaa
            </button>

            <button type="button" id="deleteMovieButton">
                Poista elokuva
            </button>

            <button type="button" id="favoriteButton">
                Lisää suosikkeihin
            </button>

            <a href="movies.html" class="button">
                ← Takaisin elokuviin
            </a>

        </section>

    </main>

    <!-- Elokuvan muokkausikkuna -->

    <dialog id="editDialog">

        <form id="editMovieForm">

            <h2>Muokkaa elokuvaa</h2>

            <label for="editTitle">Elokuvan nimi</label>

            <input
                type="text"
                id="editTitle"
                name="title"
                required
                minlength="2"
                maxlength="60"
            >

            <label for="editYear">Julkaisuvuosi</label>

            <input
                type="number"
                id="editYear"
                name="year"
                min="1888"
                max="2100"
                required
            >

            <label for="editGenre">Genre</label>

            <input
                type="text"
                id="editGenre"
                name="genre"
                required
                maxlength="40"
            >

            <label for="editRating">Arvosana</label>

            <input
                type="number"
                id="editRating"
                name="rating"
                min="0"
                max="10"
                step="0.1"
                required
            >

            <label for="editDescription">Kuvaus</label>

            <textarea
                id="editDescription"
                name="description"
                required
                minlength="10"
                maxlength="500"
            ></textarea>

            <div class="dialog-actions">

                <button type="submit">
                    Tallenna muutokset
                </button>

                <button type="button" id="closeDialogButton">
                    Peruuta
                </button>

            </div>

        </form>

    </dialog>

    <!-- Poistamisen vahvistus -->

    <dialog id="deleteDialog">

        <h2>Poistetaanko elokuva?</h2>

        <p>Haluatko varmasti poistaa tämän elokuvan?</p>

        <div class="dialog-actions">

            <button type="button" id="confirmDeleteButton">
                Kyllä, poista
            </button>

            <button type="button" id="cancelDeleteButton">
                Peruuta
            </button>

        </div>

    </dialog>

    <footer>
        <p>NETFLIX-elokuvasovellus © 2026</p>
    </footer>

</body>
</html>
