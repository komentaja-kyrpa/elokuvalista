
<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Katso omat suosikkielokuvasi.">
    <title>NETFLIX | Suosikit</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <h1 class="logo">NETFLIX</h1>

        <nav aria-label="Päänavigaatio">

            <a href="movies.html">Elokuvat</a>
            <a href="favorites.html" aria-current="page">Suosikit</a>
        </nav>
    </header>

    <main class="movies-page">

        <section class="page-heading">
            <h2>Omat suosikit</h2>

            <div class="movie-grid" id="favoritesGrid">

            <p id="favoritesMessage" role="status" aria-live="polite">

            </p>

    </main>

    <footer>
        <p>NETFLIX-elokuvasovellus © 2026</p>
